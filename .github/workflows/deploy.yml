name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd variance-calculator && npm ci && npm run build
      - run: cd hero-map && npm ci && npm run build
      - run: cd preflop-trainer && npm ci && npm run build
      - name: Combine dist outputs
        run: |
          mkdir -p _site
          cp variance-calculator/dist/* _site/
          cp hero-map/dist/* _site/
          cp preflop-trainer/dist/* _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
