[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-lab"
version = "0.1.0"
description = "Poker Lab: small tools and experiments for study and play."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Uys" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
pokerlab = "pokerlab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
